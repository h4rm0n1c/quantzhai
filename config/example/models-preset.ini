#
# models-preset.ini — example defaults with documentation.
#
# The [*] section defines defaults inherited by all models.
# Per-model sections (e.g. [model-stem]) merge on top.
# CLI flags passed to the router take precedence over ini — see
# the cascade in server-models.cpp:304-306.
#
# To override for a specific model, create a section matching
# the model's GGUF stem (without .gguf):
#
#     [my-model-name-Q4_K_M]
#     ctx-size=65536
#     spec-type=draft-mtp
#     spec-draft-n-max=2
#     spec-draft-p-min=0.75
#

[*]

# --- Inference ---
parallel=1
batch-size=4096
ubatch-size=512
threads=12
threads-batch=12

# --- Attention ---
flash-attn=on

# --- GPU split ---
# layer = each GPU gets whole layers (default)
# row   = row-wise tensor split (splits everything, including embeddings)
# tensor = backend-agnostic tensor parallelism (experimental)
split-mode=layer

# --- KV cache ---
kv-unified=1
cache-ram=8192
cache-reuse=256
mlock=1
cache-type-k=q8_0     # K cache type: q8_0, q4_0, turbo4 (experimental)
cache-type-v=turbo3    # V cache type: turbo2, turbo3, turbo4, f16, q8_0

# --- Context ---
ctx-size=262144

# --- Reasoning (deepseek format) ---
reasoning=on
reasoning-format=deepseek
reasoning-budget=-1
reasoning-budget-message=I have reasoned long enough. Let me now produce my final answer.

# =============================================================================
# Per-model examples (commented out — uncomment and adjust for your models)
# =============================================================================

# [devstral-small-24B-IQ4_XS]
# reason this model doesn't handle deepseek format:
# reasoning=off
# reasoning-format=auto
# ctx-size=131072
# main-gpu=1
# cache-type-k=q4_0

# [model-with-MTP-heads-Q4_K_M]
# spec-type=draft-mtp
# spec-draft-n-max=2
# spec-draft-p-min=0.75
