# QuantZhai Codex CLI config template.
#
# qz-codex (after #58) downloads the model catalog from /qz/codex/model-catalog
# and writes config.toml to the client-local CODEX_HOME ($HOME/.qz-codex/codex-home).
# The server regenerates the catalog at var/generated/codex/qwenzhai-models.json
# on every /qz/models/refresh call. Model metadata, context windows, truncation
# limits, reasoning levels, and system prompts belong in the generated catalog.

model_catalog_json = "var/generated/codex/qwenzhai-models.json"
model = "Qwen3.6-35B-A3B-Abliterated-Heretic-Q4_K_M"
model_provider = "quantzhai"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.quantzhai]
name = "QuantZhai"
base_url = "http://127.0.0.1:18180/v1"
wire_api = "responses"
env_key = "LOCAL_QWEN_API_KEY"
request_max_retries = 1
stream_max_retries = 1
stream_idle_timeout_ms = 600000
